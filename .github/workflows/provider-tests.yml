name: CEE Provider Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "experiment/**"
      - "engine-v3"

jobs:
  provider-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run offline provider regression tests
        run: node tests/provider.test.js && node tests/provider-engine.test.js
